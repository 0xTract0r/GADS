name: GADSBroadcastSigning
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    GADS_BROADCAST_BUNDLE_PREFIX: com.example.gads.broadcast
targets:
  H264BroadcastHost:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/H264BroadcastHost
    info:
      path: Sources/H264BroadcastHost/Info.plist
    settings:
      base:
        PRODUCT_NAME: h264-broadcast-extension
        PRODUCT_BUNDLE_IDENTIFIER: $(GADS_BROADCAST_BUNDLE_PREFIX)
        INFOPLIST_FILE: Sources/H264BroadcastHost/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - target: GADSBroadcastUpload
        embed: true
      - target: GADSBroadcastSetupUI
        embed: true
  GADSBroadcastUpload:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/GADSBroadcastUpload
    info:
      path: Sources/GADSBroadcastUpload/Info.plist
    settings:
      base:
        PRODUCT_NAME: gads-broadcast-extension
        PRODUCT_BUNDLE_IDENTIFIER: $(GADS_BROADCAST_BUNDLE_PREFIX).gads-broadcast-extension
        INFOPLIST_FILE: Sources/GADSBroadcastUpload/Info.plist
        SKIP_INSTALL: NO
  GADSBroadcastSetupUI:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/GADSBroadcastSetupUI
    info:
      path: Sources/GADSBroadcastSetupUI/Info.plist
    settings:
      base:
        PRODUCT_NAME: gads-broadcast-extensionSetupUI
        PRODUCT_BUNDLE_IDENTIFIER: $(GADS_BROADCAST_BUNDLE_PREFIX).gads-broadcast-extensionSetupUI
        INFOPLIST_FILE: Sources/GADSBroadcastSetupUI/Info.plist
        SKIP_INSTALL: NO
schemes:
  GADSBroadcastSigning:
    build:
      targets:
        H264BroadcastHost: all
